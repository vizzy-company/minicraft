<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>MiniCraft</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Courier New",monospace;color:#fff}
canvas{display:block;width:100%;height:100%}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#panel{max-height:92vh;overflow:auto}#hot{z-index:4}#inv{z-index:10}#start{z-index:20}
@media(max-width:560px){#hot .slot{width:36px;height:36px}}
#tc{position:fixed;inset:0;pointer-events:none;z-index:5}#tc *{pointer-events:auto;touch-action:none}
#tc button{position:absolute;width:58px;height:58px;border-radius:50%;border:3px solid #fff8;background:#0006;color:#fff;font-size:22px}#tc button.on{background:#fff6}
#js{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:#0004;border:3px solid #fff6}
#jk{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:#fff7;pointer-events:none!important}
#tj{right:24px;bottom:120px}#ts{right:100px;bottom:140px}#tb{right:100px;bottom:70px}#tp{right:24px;bottom:44px}
#tm,#ti,#tv{top:calc(12px + env(safe-area-inset-top,0px))}#tm{right:12px}#ti{right:80px}#tv{right:148px}
#cross{position:fixed;left:50%;top:50%;width:20px;height:20px;margin:-10px;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
#cross:before{left:9px;top:0;width:2px;height:20px}#cross:after{top:9px;left:0;height:2px;width:20px}
#bar{position:fixed;left:50%;top:calc(50% + 24px);width:80px;height:8px;margin-left:-40px;background:#000a;border:2px solid #fff;display:none}#bar i{display:block;height:100%;background:#4f4}
#hot{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:#0008;border:3px solid #333}
.slot{width:44px;height:44px;background:#8b8b8b center/72% no-repeat;image-rendering:pixelated;border:3px solid #373737;position:relative;box-sizing:border-box;cursor:pointer}
.slot.sel{border-color:#fff}
.slot b{position:absolute;right:2px;bottom:0;font-size:14px;text-shadow:2px 2px #000}
#msg{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:13px;text-shadow:1px 1px #000;pointer-events:none}
#inv{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center}
#panel{background:#c6c6c6;color:#333;padding:16px;border:4px solid #555;max-width:92vw}
#panel h3{margin:0 0 8px;font-size:16px}
.grid{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;image-rendering:pixelated}#menu{display:flex;flex-direction:column;align-items:center;gap:16px}#logo{width:min(86vw,640px);image-rendering:auto}.b{width:min(80vw,300px);padding:12px;font:20px "Courier New",monospace;background:#8b8b8b;color:#fff;border:3px solid #000;box-shadow:inset -3px -3px #555,inset 3px 3px #bbb;text-shadow:2px 2px #3f3f3f;cursor:pointer}#plr{display:flex;gap:18px;align-items:center;justify-content:center;margin-bottom:8px;flex-wrap:wrap}#c2,#c3{display:flex;align-items:center;gap:10px;justify-content:center}#c3{margin-bottom:12px}#cg2{width:96px;margin:0}#cg3{width:144px;margin:0}#car,#car3{font-size:26px;color:#555}#cres2,#cres3{width:52px;height:52px}
#mtabs{display:flex;gap:4px;margin-bottom:8px}#pvc{display:block;margin:0 auto 8px;background:#0003;border:3px solid #555;width:160px;height:220px}#bag{max-width:432px}#trash{display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px}#mpc,#mpw,#mpn{width:min(80vw,300px);padding:10px;box-sizing:border-box;font:18px "Courier New",monospace;text-align:center;border:3px solid #000;background:#c6c6c6}#mps{color:#fff;text-shadow:2px 2px #000;font-size:14px;min-height:18px;max-width:80vw;text-align:center}#uw{position:fixed;inset:0;background:#1d4fd877;pointer-events:none;display:none}#skp{flex-direction:column;align-items:center;gap:10px}#skc{width:96px;height:192px;image-rendering:pixelated;background:#0006;border:3px solid #000}#skf{display:block;text-align:center;box-sizing:border-box;cursor:pointer}.slot{touch-action:none;user-select:none}.slot[data-k]{cursor:grab}#pal{min-height:56px;max-width:min(88vw,490px)}#tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}.tab{font:14px "Courier New",monospace;padding:6px 10px;background:#8b8b8b;border:3px solid #555;color:#222;cursor:pointer}.tab.on{background:#e4e4e4;border-color:#fff #888 #888 #fff}.b:hover{background:#6f7da8}.wi{display:flex;gap:6px;width:min(88vw,420px)}.wi .b{display:flex;align-items:center;gap:12px;text-align:left}.wi img{width:44px;height:44px;image-rendering:pixelated;flex:none}.wi small{font-size:11px;opacity:.8}#wl{color:#fff;text-shadow:2px 2px #000}.wi .b{flex:1;width:auto;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wi .x{flex:none;background:#a55;font-size:14px}#wl{display:flex;flex-direction:column;gap:8px;max-height:34vh;overflow-y:auto;padding:2px}
</style></head><body>
